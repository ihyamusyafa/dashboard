<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - LPK BNI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <div class="login-container">
    <div class="login-header">
      <img src="fingerprint-icon.png" alt="Fingerprint" class="login-icon">
      <h1>Selamat Datang</h1>
      <p>Masuk ke akun Anda untuk melanjutkan</p>
    </div>

    <form action="login.php" method="POST" class="login-form">
      <label for="email">ALAMAT EMAIL</label>
      <div class="input-group">
        <input type="email" id="email" name="email" placeholder="nama@email.com" required>
      </div>

      <label for="password">PASSWORD</label>
      <div class="input-group">
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <div class="remember">
        <input type="checkbox" id="remember">
        <label for="remember">Ingat Saya</label>
      </div>

      <button type="submit" class="login-btn">Masuk Sekarang</button>

      <p class="register-text">
        Belum memiliki akun? <a href="#">Daftar Sekarang</a>
      </p>
    </form>

    <footer>
      <p>© 2026 LPK BNI. Hak Cipta Dilindungi.</p>
    </footer>
  </div>
</body>
</html>
